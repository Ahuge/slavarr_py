services:
  slavarr:
    image: ghcr.io/ahuge/slavarr_py:latest
    pull_policy: always
    env_file:
      - /share/CACHEDEV1_DATA/PlexRoot/ContainerConfig/slavarr/.env
    network_mode: host
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - /share/CACHEDEV1_DATA/PlexRoot/ContainerConfig/slavarr/data:/app/data